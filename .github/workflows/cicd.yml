name: Apigee X CI/CD with Maven

on: push

env:
  API_VERSION: googleapi
  DEFAULT_APIGEE_ORG: primal-gate-456620-t1
  DEFAULT_APIGEE_ENV: eval
  TEST_HOST: 34.120.59.6.nip.io
  GCP_SERVICE_ACCOUNT: ${{ secrets.SA_CI_CD }}

  AUTHOR_EMAIL: ''
  APIGEE_ORG: ''
  APIGEE_ENV: ''
  APIGEE_DEPLOYMENT_SUFFIX: ''

jobs:
  apigee-deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set Variables (Main/Prod/Other)
        run: |
          echo "AUTHOR_EMAIL=${{ github.actor }}" >> $GITHUB_ENV
          echo "APIGEE_ORG=${{ env.DEFAULT_APIGEE_ORG }}" >> $GITHUB_ENV
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}")
          if [[ $BRANCH == "prod" ]]; then
            echo "APIGEE_ENV=prod" >> $GITHUB_ENV
          else
            echo "APIGEE_ENV=${{ env.DEFAULT_APIGEE_ENV }}" >> $GITHUB_ENV
            echo "APIGEE_DEPLOYMENT_SUFFIX=$BRANCH" >> $GITHUB_ENV
          fi

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Lint OpenAPI (Spectral)
        run: ./node_modules/.bin/spectral lint -r ./test/spectral/.spectral.yaml -f html -o spectral-report.html ./specs/airport-1.0.0.yaml || true

      - name: Archive Spectral Report
        uses: actions/upload-artifact@v4
        with:
          name: spectral-report
          path: spectral-report.html

      - name: Apigeelint
        run: ./node_modules/apigeelint/cli.js -s ./apiproxy -f html.js -e PO013,PO025 > apigeelint-out.html

      - name: Archive Apigeelint Report
        uses: actions/upload-artifact@v4
        with:
          name: apigeelint-report
          path: apigeelint-out.html

#      - name: eslint
#        run: ./node_modules/eslint/bin/eslint.js -c .eslintrc-jsc.yml --format html ./apiproxy/resources/jsc > eslint-out.html
#
#      - name: Archive eslint Report
#        uses: actions/upload-artifact@v4
#        with:
#          name: eslint-report
#          path: eslint-out.html

      - name: mocha
        run: ./node_modules/nyc/bin/nyc.js --reporter=html --reporter=text ./node_modules/mocha/bin/_mocha ./test/unit

      - name: Archive Mocha Report
        uses: actions/upload-artifact@v4
        with:
          name: mocha-report
          path: coverage/index.html

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Create Service Account JSON File
        run: echo '${{ secrets.SA_CI_CD }}' > sa.json

      - name: Deploy Apigee Configuration (EdgeConfig)
        run: |
          sed -i "s/target_apigee_env/${APIGEE_ENV}/g" ./EdgeConfig/edge.json
          mvn install -q -Pgoogleapi -Dapigee.org=${APIGEE_ORG} -Denv=${APIGEE_ENV} -Dsa=sa.json -Dapigee.config.file=./EdgeConfig/edge.json -Dapigee.config.options=update

      - name: Package Proxy
        run: mvn process-resources -Pgoogleapi -Dcommit=${GITHUB_SHA} -Dauthor=${AUTHOR_EMAIL} -Ddeployment.suffix=${APIGEE_DEPLOYMENT_SUFFIX}

      - name: Configure Proxy
        run: mvn apigee-enterprise:configure -q -Pgoogleapi -Dorg=${APIGEE_ORG} -Denv=${APIGEE_ENV} -Ddeployment.suffix=${APIGEE_DEPLOYMENT_SUFFIX}

      - name: Deploy Proxy
        run: mvn apigee-enterprise:deploy -q -Pgoogleapi -Dorg=${APIGEE_ORG} -Denv=${APIGEE_ENV} -Dsa=sa.json -Ddeployment.suffix=${APIGEE_DEPLOYMENT_SUFFIX}

      - name: Run Apickli Tests
        run: |
          export API_BASEPATH="/airports-cicd/v1"
          sed -i "s@api_basepath@${API_BASEPATH}@g" ./test/integration/features/support/init.js
          sed -i "s@organization_hostname@${TEST_HOST}@g" ./test/integration/features/support/init.js
          node ./node_modules/.bin/cucumber-js ./test/$PROXY_NAME/integration --format json:./report.json
          node ./test/integration/index.js

      - name: Archive Apickli Report
        uses: actions/upload-artifact@v4
        with:
          name: apickli-report
          path: cucumber_report.html
